[package]
name = "capsule_toolbox"
version = "0.1.0"
description = "Capsule Toolbox, the governed SI Core companion for Windows."
authors = ["SI Core"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "capsule_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
url = "2"
tauri-plugin-log = "2"
tokio = { version = "1.54", features = ["io-util", "net", "time"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Authorization"] }
tauri-plugin-dialog = "2.8.4"
